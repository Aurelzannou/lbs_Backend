spring.application.name=lbs-backend

# Base de données
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5433/lbs_db?currentSchema=lbs
spring.datasource.username=${DB_USERNAME:lbs_user}
spring.datasource.password=${DB_PASSWORD:lbs_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=lbs

# ============================================
# Mail - SMTP
# --------------------------------------------
# En local : MailDev (conteneur lbs-maildev) — aucun compte requis,
#   les mails s'affichent sur http://localhost:1081 (rien n'est envoyé
#   pour de vrai). Port SMTP publié : localhost:1025.
# En prod  : renseigner MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD et
#   MAIL_SMTP_AUTH=true / MAIL_SMTP_STARTTLS=true (cf. application-prod).
# ============================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.from=${MAIL_FROM:LBS Education <no-reply@lbs.edu>}

# URL de base du frontend (utilisée pour construire les liens envoyés par email, ex: activation de compte)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ============================================
# Keycloak - OAuth2 Resource Server (JWT)
# ============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083/realms/lbs-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8083/realms/lbs-realm/protocol/openid-connect/certs

# ============================================
# Keycloak - Admin Client Setup
# ============================================
keycloak.admin.server-url=http://localhost:8083
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.admin.target-realm=lbs-realm
# Client public (Direct Access Grant) du front — sert à vérifier le mot de passe actuel
# de l'utilisateur lors d'un changement de mot de passe depuis son profil.
keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:lbs-client}

# ============================================
# Compte super-admin par défaut (seedé au démarrage si absent)
# À CHANGER en production via variables d'environnement.
# ============================================
superadmin.username=${SUPERADMIN_USERNAME:superadmin}
superadmin.email=${SUPERADMIN_EMAIL:admin@lbs.edu}
superadmin.password=${SUPERADMIN_PASSWORD:admin123}

# Logging (INFO en dev, ajuster en production)
logging.level.org.springframework.security=INFO

# ============================================
# Jeu de données de démonstration (référentiel + élèves fictifs)
# Voir config/DemoDataLoader.java — idempotent (repère par `code`, ne crée pas
# de doublon). Actif en local, désactivé en prod (application-prod.properties).
# Mettre DEMO_DATA_ENABLED=false pour démarrer sur une base vierge.
# ============================================
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# ============================================
# FedaPay — paiement en ligne des frais d'inscription (Mobile Money)
# Sandbox : https://sandbox-api.fedapay.com/v1   |   Live : https://api.fedapay.com/v1
# Clés à définir en VARIABLES D'ENVIRONNEMENT (ne pas committer) :
#   FEDAPAY_SECRET_KEY   = sk_sandbox_...   (backend uniquement)
#   FEDAPAY_PUBLIC_KEY   = pk_sandbox_...   (transmise au navigateur pour le widget)
#   FEDAPAY_WEBHOOK_SECRET = wh_sandbox_... (FedaPay ▸ Webhooks)
# ============================================
fedapay.base-url=${FEDAPAY_BASE_URL:https://sandbox-api.fedapay.com/v1}
fedapay.secret-key=${FEDAPAY_SECRET_KEY:}
fedapay.public-key=${FEDAPAY_PUBLIC_KEY:}
fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
# Code du type de frais encaissé à l'inscription (Référentiel ▸ Types de frais)
fedapay.type-frais-inscription=${FEDAPAY_TYPE_FRAIS_INSCRIPTION:INSCRIPTION}

# ============================================
# le port sur lequel va demarrer mon backend
# ============================================
server.port=8082

# ============================================
# MinIO - Stockage de fichiers
# ============================================
minio.url=http://localhost:9002
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=lbs-files

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# OpenAPI / Swagger UI
# ============================================
springdoc.swagger-ui.persistAuthorization=true

# ============================================
# RabbitMQ - Notifications asynchrones (email)
# ============================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:lbs_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:lbs_password}
