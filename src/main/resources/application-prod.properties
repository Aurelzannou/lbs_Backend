# ============================================================
# Profil PRODUCTION  (activé par SPRING_PROFILES_ACTIVE=prod)
# ------------------------------------------------------------
# Ne contient que les RÉGLAGES de production non sensibles.
# Les URLs et secrets (base de données, Keycloak, SMTP, MinIO,
# RabbitMQ, super-admin...) sont fournis par des VARIABLES
# D'ENVIRONNEMENT — voir deploy/.env.example.
# ============================================================

# --- Base de données : ne jamais laisser Hibernate modifier le schéma en prod.
#     'update' est toléré pour le tout premier démarrage (création du schéma),
#     puis passer à 'validate' via SPRING_JPA_HIBERNATE_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Documentation API désactivée en production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Actuator : exposer uniquement la sonde de santé
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Journalisation
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.com.App.lbs_backend=INFO

# --- Erreurs : ne pas divulguer la stack trace au client
server.error.include-stacktrace=never
server.error.include-message=always

# --- Derrière le reverse-proxy (Traefik) : respecter X-Forwarded-*
server.forward-headers-strategy=framework

# --- Jamais de données de démonstration en production
app.demo-data.enabled=false

# --- SMTP réel en production (Brevo / Gmail…) : authentification + STARTTLS.
#     L'hôte, l'identifiant et le mot de passe viennent des variables d'environnement.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
